<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Deck</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Open+Sans:wght@300;400;600;700&family=Roboto+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --title-color: #f0c040;
  --body-color: #bbbbc2;
  --accent: #e94560;
  --dim: #737380;
  --title-font: 'Montserrat', sans-serif;
  --body-font: 'Open Sans', sans-serif;
  --mono-font: 'Roboto Mono', monospace;
}

/* Reset reveal.js defaults */
.reveal { background: var(--bg); }
.reveal .slides section {
  text-align: left;
  padding: 40px 80px;
  box-sizing: border-box;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

/* Typography */
.reveal h1, .reveal h2, .reveal h3 {
  font-family: var(--title-font);
  color: var(--title-color);
  text-transform: none;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 0.4em 0;
  line-height: 1.2;
}
.reveal h1 { font-size: 3.2rem; }
.reveal h2 { font-size: 2.4rem; }
.reveal h3 { font-size: 1.8rem; }

.reveal p, .reveal li {
  font-family: var(--body-font);
  color: var(--body-color);
  font-size: 1.15rem;
  line-height: 1.6;
  margin: 0 0 0.5em 0;
}

.reveal .dim { color: var(--dim); }
.reveal .accent { color: var(--accent); }
.reveal .gold { color: var(--title-color); }

.reveal code, .reveal pre {
  font-family: var(--mono-font);
  font-size: 0.95em;
}

/* Layouts */
.slide-center {
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}

.slide-section {
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}
.slide-section h1 {
  font-size: 3rem;
}

.slide-split {
  flex-direction: row !important;
  align-items: flex-start;
  gap: 40px;
}
.slide-split .main { flex: 1.2; }
.slide-split .sidebar {
  flex: 0.8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60%;
}

.slide-stat {
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}
.slide-stat .stat-value {
  font-family: var(--title-font);
  font-size: 5rem;
  font-weight: 700;
  color: var(--title-color);
  line-height: 1;
  margin: 0.2em 0;
}
.slide-stat .stat-label {
  font-size: 1.4rem;
  color: var(--dim);
}

.slide-grid {
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr 1fr;
  gap: 20px;
  padding-top: 30px !important;
}
.slide-grid h2 {
  grid-column: 1 / -1;
  margin-bottom: 0;
}
.slide-grid .cell {
  padding: 15px;
}
.slide-grid .cell h3 {
  font-size: 1.1rem;
  margin-bottom: 0.3em;
}
.slide-grid .cell p {
  font-size: 0.95rem;
  line-height: 1.5;
}

.slide-quote {
  justify-content: center !important;
  align-items: center !important;
  text-align: center;
}
.slide-quote blockquote {
  font-family: var(--title-font);
  font-size: 1.8rem;
  color: var(--body-color);
  border: none;
  font-style: italic;
  max-width: 80%;
  line-height: 1.5;
  padding: 0;
  margin: 0;
}
.slide-quote .attribution {
  color: var(--dim);
  font-size: 1rem;
  margin-top: 1em;
  font-style: normal;
}

/* Body text preserves newlines */
.body-text {
  white-space: pre-line;
  line-height: 1.65;
}

/* Number badge for concept slides */
.num-badge {
  font-family: var(--title-font);
  font-size: 0.85rem;
  color: var(--dim);
  font-weight: 700;
  margin-bottom: 0.2em;
}

/* Progress bar */
.reveal .progress { color: var(--title-color); height: 3px; }
.reveal .controls { color: var(--dim); }
</style>
</head>
<body>
<div class="reveal">
<div class="slides">
<section data-background-color="#0d1117" class="slide-center">
<h1>TEST DECK</h1>
<p class="dim">Renderer verification</p>

</section>

<section data-background-color="#0d1117">
<div class="num-badge">01</div>
<h2 style="color:#f0c040">CONCEPT</h2>
<div class="body-text">This is body text.<br>With newlines.<br><br>And paragraphs.</div>

</section>

<section data-background-color="#0d1117" class="slide-split">
<div class="main">

<h2>SPLIT LAYOUT</h2>
<div class="body-text">Left side content.<br>Multiple lines.</div>
</div>
<div class="sidebar">
<div class="body-text" style="font-size:2rem;color:#f0c040;text-align:center;font-weight:700">3.3×<br>the advantage</div>
</div>

</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.esm.js" type="module"></script>
<script type="module">
import Reveal from 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.esm.js';
Reveal.initialize({
  hash: true,
  transition: 'fade',
  transitionSpeed: 'slow',
  controls: true,
  progress: true,
  center: false,
  width: 1280,
  height: 720,
});
</script>
</body>
</html>
