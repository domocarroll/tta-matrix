name = "tta-pete-demo"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Env vars (TTA_MODEL) and the ANTHROPIC_API_KEY secret are managed in the
# Cloudflare dashboard, not here (defining them in [vars] conflicts with the
# existing bindings). The old ANTHROPIC_BASE_URL proxy var is now inert — the
# code always calls Anthropic direct.
